<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>التحديات | آيرون فورج</title>
<link rel="stylesheet" href="../css/style.css">
</head>
<body>
<div id="navbar-root"></div>

<main>
  <section class="page-hero container">
    <div class="eyebrow" style="justify-content:center;" data-ar="تحفيز" data-en="Motivation">تحفيز</div>
    <h1 data-ar="تحديات تخليك مستمر" data-en="Challenges that keep you consistent">تحديات تخليك مستمر</h1>
    <p data-ar="انضم لتحدي، سجّل حضورك كل يوم، وشوف الستريك بتاعك بيكبر." data-en="Join a challenge, check in daily, and watch your streak grow.">انضم لتحدي، سجّل حضورك كل يوم، وشوف الستريك بتاعك بيكبر.</p>
  </section>

  <section class="section-tight">
    <div class="container">
      <div class="grid grid-2" id="challengesGrid"></div>
    </div>
  </section>
</main>

<div id="footer-root"></div>

<script src="../js/main.js"></script>
<script src="../js/challenges.js"></script>
<script>
  function render(){
    const lang = IF.getLang();
    const state = getChallengeState();
    document.getElementById('challengesGrid').innerHTML = CHALLENGE_LIST.map(c => {
      const joined = !!state[c.id];
      const streak = getStreak(c.id);
      const pct = joined ? Math.min(100, Math.round((streak / c.days) * 100)) : 0;
      const today = new Date().toISOString().slice(0,10);
      const doneToday = joined && state[c.id].checks.includes(today);
      return `
      <div class="card" data-reveal>
        <div class="flex items-center gap-12" style="margin-bottom:12px;">
          <span style="font-size:2rem;">${c.icon}</span>
          <div>
            <h3 style="font-size:1.05rem; margin:0;">${lang==='ar'?c.ar:c.en}</h3>
            <span class="stat-label">${c.days} ${lang==='ar'?'يوم':'days'}</span>
          </div>
        </div>
        ${joined ? `
          <div class="progress-bar" style="margin-bottom:8px;"><div class="progress-bar-fill" style="width:${pct}%"></div></div>
          <p style="font-size:.85rem;">${lang==='ar'?`أنجزت ${streak} من ${c.days} يوم`:`${streak} of ${c.days} days done`}</p>
          <button class="btn ${doneToday ? 'btn-ghost' : 'btn-primary'} btn-block" data-checkin="${c.id}" ${doneToday?'disabled':''}>
            ${doneToday ? (lang==='ar'?'✓ سجّلت النهاردة':'✓ Checked in today') : (lang==='ar'?'سجّل حضور النهاردة':'Check in today')}
          </button>
        ` : `
          <button class="btn btn-outline btn-block" data-join="${c.id}">${lang==='ar'?'انضم للتحدي':'Join Challenge'}</button>
        `}
      </div>`;
    }).join('');

    document.querySelectorAll('[data-join]').forEach(btn=>{
      btn.addEventListener('click', ()=>{ joinChallenge(btn.getAttribute('data-join')); render(); });
    });
    document.querySelectorAll('[data-checkin]').forEach(btn=>{
      btn.addEventListener('click', ()=>{ checkInToday(btn.getAttribute('data-checkin')); render(); });
    });
  }
  render();
  document.addEventListener('if:langchange', render);
</script>
</body>
</html>
